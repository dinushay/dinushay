<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects | Meine Projekte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            border-color: rgba(99, 102, 241, 0.5);
        }
        .modal-enter {
            opacity: 0;
            transform: scale(0.95);
        }
        .modal-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.2s ease-out, transform 0.2s ease-out;
        }
        .modal-exit {
            opacity: 1;
            transform: scale(1);
        }
        .modal-exit-active {
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.2s ease-in, transform 0.2s ease-in;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col relative overflow-x-hidden">
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-indigo-900/20 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-900/20 rounded-full blur-[120px]"></div>
    </div>
    <nav class="w-full py-6 px-4 md:px-8 flex justify-between items-center max-w-7xl mx-auto z-10">
        <a href="https://dinushay.de" class="flex items-center gap-3 hover:opacity-80 transition-opacity group">
            <img src="https://dinushay.de/dinu.png" alt="Logo" class="w-10 h-10 rounded-lg shadow-lg shadow-indigo-500/20 object-cover bg-slate-800" onerror="this.src='https://placehold.co/40x40/4f46e5/white?text=D'">
            <h1 class="font-bold text-xl tracking-tight text-white group-hover:text-indigo-300 transition-colors">dinushay.de</h1>
        </a>
        
        <button id="lang-toggle" class="px-4 py-2 rounded-full glass-panel hover:bg-slate-800 transition-colors text-sm font-medium flex items-center gap-2">
            <i class="fa-solid fa-globe"></i>
            <span id="current-lang-text">EN</span>
        </button>
    </nav>
    <main class="flex-grow container mx-auto px-4 py-12 max-w-6xl z-10">
        <div class="text-center mb-16">
            <h2 id="hero-title" class="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-cyan-400 mb-4">
                My Projects
            </h2>
            <p id="hero-subtitle" class="text-slate-400 max-w-2xl mx-auto text-lg">
                A collection of my Minecraft plugins, Discord bots, and services.
            </p>
        </div>
        <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6 mb-12">
        </div>
        <div class="text-center">
            <a href="https://github.com/dinushay?tab=repositories" target="_blank" class="inline-flex items-center gap-3 px-6 py-4 rounded-xl glass-panel hover:bg-slate-800/80 text-slate-300 hover:text-white transition-all group border-slate-700/50 hover:border-indigo-500/50">
                <i class="fa-brands fa-github text-2xl"></i>
                <span id="more-projects-text" class="font-medium">More projects can be found in my GitHub repositories</span>
                <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform text-indigo-400"></i>
            </a>
        </div>
    </main>
    <footer class="py-8 text-center text-slate-600 text-sm z-10">
        <p>&copy; 2026 dinushay.de</p>
    </footer>
    <div id="modal-backdrop" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4 transition-opacity duration-300 opacity-0">
        <div id="modal-content" class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-lg p-6 shadow-2xl relative transform scale-95 transition-transform duration-300">
            <button id="close-modal" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-800">
                <i class="fa-solid fa-times"></i>
            </button>
            <div class="mb-6">
                <div id="modal-icon" class="w-12 h-12 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center text-2xl mb-4">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <h3 id="modal-title" class="text-2xl font-bold text-white mb-2">Project Title</h3>
                <p id="modal-type" class="text-sm font-medium text-indigo-400 uppercase tracking-wider mb-4">Type</p>
                <div id="modal-desc" class="text-slate-300 leading-relaxed mb-6">
                    Description goes here.
                </div>
            </div>
            <div class="space-y-3" id="modal-actions">
            </div>
            <div id="modal-contact" class="hidden mt-4 pt-4 border-t border-slate-800">
                <p class="text-slate-300 mb-3 text-sm" id="modal-contact-text"></p>
                <div class="flex flex-col gap-2">
                    <a href="https://discord.gg/wYqGmafvQR" target="_blank" class="flex items-center gap-3 p-3 rounded-lg bg-indigo-600/10 border border-indigo-600/30 hover:bg-indigo-600/20 transition-all group">
                        <i class="fa-brands fa-discord text-indigo-400 group-hover:text-indigo-300"></i>
                        <span class="text-indigo-100">Discord: @dinu_shay</span>
                    </a>
                    <a href="mailto:dinu@dinushay.de" class="flex items-center gap-3 p-3 rounded-lg bg-slate-800/50 border border-slate-700 hover:bg-slate-800 transition-all group">
                        <i class="fa-solid fa-envelope text-slate-400 group-hover:text-white"></i>
                        <span class="text-slate-200">dinu@dinushay.de</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
    <script>
        const projects = [
            {
                id: 'cliplink',
                icon: 'fa-robot',
                color: 'text-indigo-400',
                bgColor: 'bg-indigo-400/10',
                title: 'ClipLink',
                type: { en: 'Discord Bot', de: 'Discord Bot' },
                desc: {
                    en: 'ClipLink is a powerful and easy-to-use Discord bot designed to automatically fetch and post the latest Twitch clips from your favorite streamers directly into your Discord server.',
                    de: 'ClipLink ist ein leistungsstarker und benutzerfreundlicher Discord-Bot, der automatisch die neuesten Twitch-Clips deiner Lieblings-Streamer direkt in deinen Discord-Server postet.'
                },
                links: [
                    { label: 'GitHub', url: 'https://github.com/dinushay/cliplink', icon: 'fa-brands fa-github', style: 'github' },
                    { label: 'Discord Invite', url: 'https://discord.com/oauth2/authorize?client_id=1431371175379992636&scope=bot&permissions=19456', icon: 'fa-brands fa-discord', style: 'discord' }
                ]
            },
            {
                id: 'hosting',
                icon: 'fa-hard-drive',
                color: 'text-orange-400',
                bgColor: 'bg-orange-400/10',
                title: 'Minecraft Server Hosting',
                type: { en: 'Service', de: 'Dienstleistung' },
                desc: {
                    en: 'Germany recommended, EU only. I offer to host a server that will be available 24/7 for communities where an Aternos server would not be sufficient due to performance and limitations. Free of charge.',
                    de: 'Standort Deutschland empfohlen, nur EU. Ich biete an, kostenlos einen 24/7-Server für Communities zu hosten, für die ein Aternos-Server wegen Performance und Limitierungen nicht ausreicht.'
                },
                isContact: true,
                contactText: {
                    en: 'You can contact me personally via Discord or Email:',
                    de: 'Du kannst mich persönlich per Discord oder E-Mail kontaktieren:'
                }
            }
        ];

        const uiText = {
            en: {
                heroTitle: 'My Projects',
                heroSubtitle: 'A collection of my Minecraft plugins, Discord bots, and services.',
                viewProject: 'View Project',
                selectOption: 'Select Destination',
                close: 'Close',
                moreProjects: 'More projects can be found in my GitHub repositories'
            },
            de: {
                heroTitle: 'Meine Projekte',
                heroSubtitle: 'Eine Sammlung meiner Minecraft-Plugins, Discord-Bots und Dienstleistungen.',
                viewProject: 'Projekt ansehen',
                selectOption: 'Ziel auswählen',
                close: 'Schließen',
                moreProjects: 'Mehr Projekte sind in meinen GitHub-Repositories zu finden'
            }
        };

        let currentLang = 'en';

        const userLang = navigator.language || navigator.userLanguage; 
        if (userLang.startsWith('de')) {
            currentLang = 'de';
        }

        const projectsGrid = document.getElementById('projects-grid');
        const modalBackdrop = document.getElementById('modal-backdrop');
        const modalContent = document.getElementById('modal-content');
        const closeModalBtn = document.getElementById('close-modal');
        const langToggleBtn = document.getElementById('lang-toggle');
        const moreProjectsText = document.getElementById('more-projects-text');

        function updateUIText() {
            const t = uiText[currentLang];
            document.getElementById('hero-title').innerText = t.heroTitle;
            document.getElementById('hero-subtitle').innerText = t.heroSubtitle;
            document.getElementById('current-lang-text').innerText = currentLang.toUpperCase();
            
            if(moreProjectsText) moreProjectsText.innerText = t.moreProjects;
            
            renderProjects();
        }

        function renderProjects() {
            projectsGrid.innerHTML = '';
            projects.forEach(project => {
                const card = document.createElement('div');
                card.className = 'glass-panel rounded-2xl p-6 card-hover flex flex-col cursor-pointer group';
                card.onclick = () => openModal(project);

                card.innerHTML = `
                    <div class="flex items-start justify-between mb-4">
                        <div class="w-12 h-12 rounded-xl ${project.bgColor} ${project.color} flex items-center justify-center text-2xl">
                            <i class="fa-solid ${project.icon}"></i>
                        </div>
                        <i class="fa-solid fa-arrow-up-right-from-square text-slate-500 group-hover:text-white transition-colors"></i>
                    </div>
                    <h3 class="text-xl font-bold text-white mb-1">${project.title}</h3>
                    <p class="text-xs font-semibold uppercase tracking-wide text-slate-500 mb-3">${project.type[currentLang]}</p>
                    <p class="text-slate-400 text-sm leading-relaxed mb-6 flex-grow line-clamp-3">
                        ${project.desc[currentLang]}
                    </p>
                    <button class="w-full py-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-medium text-sm transition-colors border border-slate-700">
                        ${uiText[currentLang].viewProject}
                    </button>
                `;
                projectsGrid.appendChild(card);
            });
        }

        function openModal(project) {
            document.getElementById('modal-title').innerText = project.title;
            document.getElementById('modal-type').innerText = project.type[currentLang];
            document.getElementById('modal-desc').innerText = project.desc[currentLang];
            
            const iconDiv = document.getElementById('modal-icon');
            iconDiv.className = `w-12 h-12 rounded-xl ${project.bgColor} ${project.color} flex items-center justify-center text-2xl mb-4`;
            iconDiv.innerHTML = `<i class="fa-solid ${project.icon}"></i>`;

            const actionsDiv = document.getElementById('modal-actions');
            actionsDiv.innerHTML = ''; 
            
            const contactDiv = document.getElementById('modal-contact');
            
            if (project.links && project.links.length > 0) {
                contactDiv.classList.add('hidden');
                
                const header = document.createElement('h4');
                header.className = 'text-sm text-slate-500 font-semibold mb-2';
                header.innerText = uiText[currentLang].selectOption;
                actionsDiv.appendChild(header);

                project.links.forEach(link => {
                    const btn = document.createElement('a');
                    btn.href = link.url;
                    btn.target = '_blank';
                    
                    let btnClasses = 'flex items-center justify-center gap-3 w-full py-3 rounded-xl font-medium transition-all duration-200 ';
                    
                    if (link.style === 'github') {
                        btnClasses += 'bg-slate-800 hover:bg-slate-700 text-white border border-slate-600';
                    } else if (link.style === 'discord') {
                        btnClasses += 'bg-[#5865F2] hover:bg-[#4752C4] text-white shadow-lg shadow-indigo-500/20';
                    } else {
                        btnClasses += 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-500/20';
                    }

                    btn.className = btnClasses;
                    btn.innerHTML = `<i class="${link.icon}"></i> <span>${link.label}</span>`;
                    actionsDiv.appendChild(btn);
                });
            }

            if (project.isContact) {
                contactDiv.classList.remove('hidden');
                document.getElementById('modal-contact-text').innerText = project.contactText[currentLang];
            } else {
                contactDiv.classList.add('hidden');
            }

            modalBackdrop.classList.remove('hidden');
            setTimeout(() => {
                modalBackdrop.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
            document.body.style.overflow = 'hidden'; 
        }

        function closeModal() {
            modalBackdrop.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modalBackdrop.classList.add('hidden');
                document.body.style.overflow = '';
            }, 300); 
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'de' : 'en';
            updateUIText();
        }
        
        closeModalBtn.addEventListener('click', closeModal);
        
        modalBackdrop.addEventListener('click', (e) => {
            if (e.target === modalBackdrop) {
                closeModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !modalBackdrop.classList.contains('hidden')) {
                closeModal();
            }
        });

        langToggleBtn.addEventListener('click', toggleLanguage);

        updateUIText();

    </script>
</body>
</html>
