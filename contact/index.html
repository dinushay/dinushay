<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Kontakt - dinushay.de</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569; 
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            border-color: rgba(99, 102, 241, 0.5);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col relative overflow-x-hidden">
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-indigo-900/20 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-900/20 rounded-full blur-[120px]"></div>
    </div>
    
    <nav class="w-full py-6 px-4 md:px-8 flex justify-between items-center max-w-7xl mx-auto z-10">
        <a href="/" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
            <img src="https://dinushay.de/dinu.png" alt="Logo" class="w-10 h-10 rounded-lg shadow-lg shadow-indigo-500/20 object-cover bg-slate-800" onerror="this.src='https://placehold.co/40x40/4f46e5/white?text=D'">
            <h1 class="font-bold text-xl tracking-tight text-white">dinushay.de</h1>
        </a>
    
        <button id="lang-toggle" class="px-4 py-2 rounded-full glass-panel hover:bg-slate-800 transition-colors text-sm font-medium flex items-center gap-2">
            <i class="fa-solid fa-globe"></i>
            <span id="current-lang-text">EN</span>
        </button>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-12 max-w-4xl z-10 flex flex-col justify-center">
        <div class="text-center mb-16">
            <h2 id="hero-title" class="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-cyan-400 mb-4">
                Contact Me
            </h2>
            <p id="hero-subtitle" class="text-slate-400 max-w-2xl mx-auto text-lg">
                Feel free to reach out via email or add me directly on Discord.
            </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-3xl mx-auto w-full">
            <a href="mailto:dinu@dinushay.de" class="glass-panel rounded-2xl p-6 card-hover flex flex-col cursor-pointer group no-underline text-current">
                <div class="flex items-start justify-between mb-4">
                    <div class="w-12 h-12 rounded-xl bg-indigo-400/10 text-indigo-400 flex items-center justify-center text-2xl">
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <i class="fa-solid fa-arrow-up-right-from-square text-slate-500 group-hover:text-white transition-colors"></i>
                </div>
                <h3 id="email-title" class="text-xl font-bold text-white mb-1">Email</h3>
                <p id="email-desc" class="text-slate-400 text-sm leading-relaxed mb-6 flex-grow">
                    Send me a message at dinu@dinushay.de
                </p>
                <div class="w-full py-2.5 rounded-lg bg-slate-800 group-hover:bg-slate-700 text-white font-medium text-sm transition-colors border border-slate-700 flex justify-center items-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> <span id="email-action-text">Send Email</span>
                </div>
            </a>

            <div id="discord-action" class="glass-panel rounded-2xl p-6 card-hover flex flex-col cursor-pointer group">
                <div class="flex items-start justify-between mb-4">
                    <div class="w-12 h-12 rounded-xl bg-[#5865F2]/10 text-[#5865F2] flex items-center justify-center text-2xl">
                        <i class="fa-brands fa-discord"></i>
                    </div>
                    <i class="fa-solid fa-arrow-up-right-from-square text-slate-500 group-hover:text-white transition-colors"></i>
                </div>
                <h3 id="discord-title" class="text-xl font-bold text-white mb-1">Discord</h3>
                <p id="discord-desc" class="text-slate-400 text-sm leading-relaxed mb-6 flex-grow">
                    Add me on Discord: @dinu_shay
                </p>
                <button class="w-full py-2.5 rounded-lg bg-slate-800 group-hover:bg-[#5865F2] text-white font-medium text-sm transition-colors border border-slate-700 group-hover:border-[#5865F2] flex justify-center items-center gap-2">
                    <i class="fa-solid fa-clone" id="discord-icon"></i> <span id="discord-action-text">Copy Username</span>
                </button>
            </div>
        </div>
    </main>

    <footer class="py-8 text-center text-slate-600 text-sm z-10">
        <p>&copy; 2026 dinushay.de</p>
    </footer>

    <script>
        const uiText = {
            en: {
                heroTitle: 'Contact Me',
                heroSubtitle: 'Reach out via email or add me directly on Discord.',
                emailTitle: 'Email',
                emailDesc: 'Send me a message at dinu@dinushay.de',
                emailAction: 'Send Email',
                discordTitle: 'Discord',
                discordDesc: 'Add me on Discord: @dinu_shay',
                discordAction: 'Copy Username',
                discordCopied: 'Copied!'
            },
            de: {
                heroTitle: 'Kontakt',
                heroSubtitle: 'Erreichbar per E-Mail oder über mein Discord-Ticket-System.',
                emailTitle: 'E-Mail',
                emailDesc: 'Schreib mir direkt an dinu@dinushay.de',
                emailAction: 'E-Mail senden',
                discordTitle: 'Discord Ticket',
                discordDesc: 'Erstelle ein Ticket auf meinem Discord-Server für Anfragen.',
                discordAction: 'Ticket öffnen',
                discordCopied: 'Geöffnet!'
            }
        };

        let currentLang = 'en';
        const userLang = navigator.language || navigator.userLanguage; 
        if (userLang.startsWith('de')) {
            currentLang = 'de';
        }

        const langToggleBtn = document.getElementById('lang-toggle');
        const discordBtn = document.getElementById('discord-action');
        let copyTimeout;

        function updateUIText() {
            const t = uiText[currentLang];
            document.getElementById('hero-title').innerText = t.heroTitle;
            document.getElementById('hero-subtitle').innerText = t.heroSubtitle;
            document.getElementById('current-lang-text').innerText = currentLang.toUpperCase();
            
            document.getElementById('email-title').innerText = t.emailTitle;
            document.getElementById('email-desc').innerText = t.emailDesc;
            document.getElementById('email-action-text').innerText = t.emailAction;
            
            document.getElementById('discord-title').innerText = t.discordTitle;
            document.getElementById('discord-desc').innerText = t.discordDesc;
            document.getElementById('discord-action-text').innerText = t.discordAction;

            const discordIcon = document.getElementById('discord-icon');
            if(currentLang === 'de') {
                discordIcon.className = 'fa-solid fa-ticket';
            } else {
                discordIcon.className = 'fa-solid fa-clone';
            }
        }

        function handleDiscordClick() {
            if (currentLang === 'de') {
                window.open('https://discord.gg/sNQwgM5Ufn', '_blank');
            } else {
                const tempInput = document.createElement('input');
                tempInput.value = 'dinu_shay';
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
                
                const btnText = document.getElementById('discord-action-text');
                btnText.innerText = uiText[currentLang].discordCopied;
                
                clearTimeout(copyTimeout);
                copyTimeout = setTimeout(() => {
                    btnText.innerText = uiText[currentLang].discordAction;
                }, 2000);
            }
        }

        langToggleBtn.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'de' : 'en';
            updateUIText();
        });

        discordBtn.addEventListener('click', handleDiscordClick);

        updateUIText();
    </script>
</body>
</html>
